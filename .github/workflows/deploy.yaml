name: Deploy Knowledge Base

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.gitignore'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'LICENSE'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force:
        description: 'Force deployment (emergency)'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000

      - name: Run all linters
        run: npm run lint:all

      - name: Run URL checker script
        env:
          URL_CHECKER_TIMEOUT: ${{ vars.URL_CHECKER_TIMEOUT }}
        run: node script/url-checker.js -t "$URL_CHECKER_TIMEOUT" -d src/posts

      - name: Run remaining scripts
        run: |
          set -e
          for f in script/*.js; do
            if [ "$f" != "script/url-checker.js" ]; then
              echo "Running $f"
              node "$f"
            fi
          done

  build:
    name: build
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        run: npm ci --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000

      - name: Rebuild sharp for Linux
        run: npm rebuild sharp --platform=linux --arch=x64 --libc=glibc

      - name: Set PATH_PREFIX
        run: |
          REPO_NAME="${{ github.repository }}"
          echo "PATH_PREFIX=/${REPO_NAME#*/}/" >> "$GITHUB_ENV"

      - name: Build production site
        run: npm run prod
        env:
          PATH_PREFIX: ${{ env.PATH_PREFIX }}

      - name: Upload built site as artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: deploy
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      issues: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: github-pages

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Create deployment summary issue
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.deployment.outcome }}" = "success" ]; then
            STATUS="succeeded"
          else
            STATUS="failed"
          fi
          DATE=$(date +'%Y-%m-%d')
          gh issue create \
            --title "$DATE - Deployment: $STATUS" \
            --body "URL: ${{ steps.deployment.outputs.page_url }}"

      - name: Fail job if deployment failed
        if: steps.deployment.outcome != 'success'
        run: exit 1
